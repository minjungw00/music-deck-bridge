name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: ubuntu
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm run build:chrome
      - run: npm run build:streamdeck
      - name: Record build source and package checksums
        run: node scripts/artifacts.mjs development
      - uses: actions/upload-artifact@v7
        with:
          name: music-deck-bridge-dev-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.streamDeckPlugin
            dist/BUILD-INFO.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
