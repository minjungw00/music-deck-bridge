<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Deck Bridge</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 290px; margin: 0; padding: 17px; font: 13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background: #171820; color: #f3f3f3; }
    h1 { font-size: 15px; margin: 0 0 5px; }
    p { margin: 8px 0 12px; color: #bac0ce; }
    label { display: block; margin: 10px 0 5px; font-weight: 600; }
    input { width: 100%; padding: 9px; border: 1px solid #636a78; border-radius: 6px; background: #282c38; color: white; letter-spacing: .3em; font-size: 16px; }
    button { padding: 9px 13px; background: #df3652; border: 0; border-radius: 6px; color: white; cursor: pointer; font-weight: 600; }
    button.secondary { background: #414759; }
    .port-row { display: flex; gap: 8px; }
    .port-row input { flex: 1; min-width: 0; font-size: 13px; letter-spacing: 0; padding: 8px; }
    .port-row button { white-space: nowrap; }
    .small-hint { font-size: 11px; line-height: 1.35; color: #abb3c5; margin: 4px 0 10px; }
    .controls { display: flex; gap: 8px; margin-top: 12px; }
    #status { margin: 10px 0 0; min-height: 35px; white-space: pre-wrap; font-size: 12px; }
  </style>
</head>
<body>
  <h1 id="heading">Music Deck Bridge</h1>
  <p id="subtitle" class="small-hint">For YouTube Music · Stream Deck integration</p>
  <p id="guide">Generate a PIN from a Stream Deck action and enter it here.</p>
  <label id="pinLabel" for="pin">Connection PIN</label>
  <input id="pin" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="000000" />
  <div class="controls">
    <button id="connect">Connect</button>
    <button id="refresh" class="secondary">Check status</button>
    <button id="forget" class="secondary">Unpair</button>
  </div>
  <label id="portLabel" for="port">Local server port</label>
  <div class="port-row"><input id="port" type="number" min="1024" max="65535" inputmode="numeric" value="17864"/><button id="savePort" class="secondary">Apply</button></div>
  <p id="portHint" class="small-hint">Same port as Stream Deck. When connected, changing it here also changes the local server.</p>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
